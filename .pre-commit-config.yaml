repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Python tools run from the uv lockfile so versions match `just check` and CI.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --project backend ruff check --fix backend
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format backend
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --project backend mypy backend/src backend/tests
        language: system
        pass_filenames: false
        types: [python]
      - id: import-linter
        name: import-linter
        entry: bash -c 'cd backend && uv run lint-imports'
        language: system
        pass_filenames: false
        types: [python]
