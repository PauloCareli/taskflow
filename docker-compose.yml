services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # `docker compose --profile full up` runs the API and the worker next to the services above.
  api:
    profiles: [full]
    build: ./backend
    environment: &app-env
      TASKAPP_DATABASE_URL: postgresql+asyncpg://taskflow:taskflow@postgres:5432/taskflow
      TASKAPP_REDIS_URL: redis://redis:6379/0
      # Passed through from your shell or a root `.env`; the API refuses to start if it is empty.
      TASKAPP_JWT_SECRET: ${TASKAPP_JWT_SECRET:-}
    depends_on: &app-deps
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  worker:
    profiles: [full]
    build: ./backend
    command: ["celery", "-A", "taskapp.infrastructure.celery_app", "worker", "--loglevel=info"]
    environment: *app-env
    depends_on: *app-deps
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A taskapp.infrastructure.celery_app inspect ping -d celery@$$HOSTNAME
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
